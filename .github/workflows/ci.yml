name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Csms.slnx

      - name: Build
        run: dotnet build Csms.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Csms.slnx --no-build --configuration Release
