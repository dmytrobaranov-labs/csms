# Local development infrastructure. Values below are dev-only defaults;
# override them via a .env file next to this compose file (see .env.example).
# Host ports bind to 127.0.0.1 only: Seq runs without login and Jaeger has
# no auth, so nothing here should be reachable from the local network.
services:
  postgres:
    image: postgres:16-alpine
    container_name: csms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csms}
      POSTGRES_USER: ${POSTGRES_USER:-csms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csms_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Structured logs (Serilog sink). UI and API on port 80, ingestion-only on 5341.
  seq:
    image: datalust/seq:2026.1.17526
    container_name: csms-seq
    environment:
      ACCEPT_EULA: "Y"
      # Applied on first start only, when the seq-data volume is empty.
      SEQ_FIRSTRUN_NOAUTHENTICATION: ${SEQ_NO_AUTH:-true}
    ports:
      - "127.0.0.1:${SEQ_UI_PORT:-5380}:80"
      - "127.0.0.1:${SEQ_INGEST_PORT:-5341}:5341"
    volumes:
      - seq-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Distributed traces via OTLP. Jaeger v2 with in-memory storage: traces are
  # lost on restart. The image has no shell, so there is no healthcheck.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: csms-jaeger
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${JAEGER_OTLP_HTTP_PORT:-4318}:4318"

volumes:
  postgres-data:
  seq-data:
