# Local development infrastructure. Values below are dev-only defaults;
# override them via a .env file next to this compose file.
services:
  postgres:
    image: postgres:16-alpine
    container_name: csms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csms}
      POSTGRES_USER: ${POSTGRES_USER:-csms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csms_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
